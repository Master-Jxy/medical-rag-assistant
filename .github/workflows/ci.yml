name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: backend
  VISION_CHAT_ENABLED: "false"
  VISION_PROVIDER: disabled
  VISION_AUTOMATIC_RETRIES: "0"
  VISION_OCR_MODE_ENABLED: "false"
  VISION_OCR_PROVIDER: disabled

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend tests
        run: python -m pytest -q backend/tests
      - name: Alembic 0029 to 0030 roundtrip
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/stage26-ci.db
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini downgrade 0029_dedup_version_governance
          python -m alembic -c backend/alembic.ini upgrade head
      - name: Python dependency consistency
        run: python -m pip check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:stream
      - run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  release-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Diff and sensitive-file release preflight
        run: |
          git diff --check
          python backend/scripts/release_preflight.py --repo-root .
